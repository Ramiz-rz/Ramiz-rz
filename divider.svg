<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="44" viewBox="0 0 1280 44" role="img"><defs><style>
text{font-family:'SGX','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.b{font-weight:700}
.m{font-family:'JBX','JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;font-variant-ligatures:none;font-weight:400}
.mb{font-family:'JBX','JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;font-variant-ligatures:none;font-weight:700}
.fu{animation:fu .85s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fi .9s ease both}
.bl{animation:bl 1s steps(1) infinite}
.pl{animation:pl 2.2s ease-in-out infinite}
.pt{animation:fl 7s linear infinite}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes fu{from{opacity:0;transform:translateY(16px)}}
@keyframes fi{from{opacity:0}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fl{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-140px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style><linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".75"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity=".75"/></linearGradient><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><linearGradient id="dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient></defs><rect x="60" y="21" width="1160" height="2" rx="1" fill="url(#dl)" fill-opacity=".55"/><g><circle r="9" fill="#22d3ee" fill-opacity=".25"/><circle r="3.6" fill="#fff"/><animateMotion dur="5s" repeatCount="indefinite" path="M60 22 L1220 22" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></g><g transform="translate(640 22)"><g class="fb"><animateTransform attributeName="transform" type="rotate" values="0;90;90" keyTimes="0;.4;1" dur="4s" repeatCount="indefinite"/><rect x="-7" y="-7" width="14" height="14" rx="3" fill="#0d0e16" stroke="url(#grad)" stroke-width="2"/></g></g></svg>